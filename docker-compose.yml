services:
  pandadays:
    image: localhost/pandadays:latest
    container_name: pandadays
    user: "1000:1000"
    pull_policy: never
    expose:
      - "8080"
    environment:
      BASE_URL: https://days.example.com # Replace with your public address.
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - proxynet

networks:
  proxynet:
    external: true 