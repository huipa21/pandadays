{{define "title"}}{{t "password.title"}} · {{t "app.name"}}{{end}}
{{define "content"}}
<section class="card auth-card">
  <h1>{{t "password.title"}}</h1>
  {{if .User.MustChangePassword}}<p class="notice">{{t "password.forced"}}</p>{{end}}
  {{with .Error}}<p class="alert" role="alert">{{t .}}</p>{{end}}
  <form method="post" action="/password" class="form">
    {{template "csrf-field" .}}
    <input type="text" name="username" value="{{.User.Username}}" autocomplete="username" hidden>
    <label>{{t "password.current"}}
      <input type="password" name="current_password" autocomplete="current-password" required autofocus>
    </label>
    <label>{{t "password.new"}}
      <input type="password" name="new_password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
    </label>
    <label>{{t "password.confirm"}}
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </label>
    <p id="password-hint" class="hint">{{t "password.hint"}}</p>
    <button type="submit" class="btn">{{t "password.submit"}}</button>
  </form>
</section>
{{end}}
