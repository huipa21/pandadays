{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
<meta name="csrf-token" content="{{.CSRFToken}}">
<title>{{block "title" .}}{{t "app.name"}}{{end}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
{{if .CaptureTimezone}}<script src="/static/timezone.js" defer></script>{{end}}
</head>
<body hx-headers='{"X-CSRF-Token":"{{.CSRFToken}}"}'>
<header class="site-header">
  <a class="brand" href="/">🐼 {{t "app.name"}}</a>
  {{with .User}}<nav class="nav">
    <span class="nav-user">{{.Username}}</span>
    <a href="/password">{{t "nav.password"}}</a>
    <form method="post" action="/logout" class="inline-form">{{template "csrf-field" $}}<button type="submit" class="link-button">{{t "nav.logout"}}</button></form>
  </nav>{{end}}
</header>
<main class="container">
{{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
{{define "csrf-field"}}<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{end}}
